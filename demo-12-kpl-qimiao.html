<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPL奇妙日 · 多点位打卡 Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --deep-purple: #1a0533;
            --kpl-purple: #6b1fb8;
            --kpl-dark: #4a148c;
            --gold: #ffd700;
            --cyan: #00e5ff;
            --nfc-red: #ff6b6b;
            --game-violet: #6c5ce7;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #ffffff;
            color: #2d2d2d;
            min-height: 100vh; display: flex; justify-content: center; padding: 20px;
        }
        .phone {
            width: 390px; min-height: 750px; background: #f8f8f8;
            border-radius: 32px; overflow: hidden; border: 3px solid #ddd;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
            display: flex; flex-direction: column;
        }
        .phone-header {
            background: linear-gradient(135deg, var(--kpl-dark), #2a1060);
            padding: 14px 20px; display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .back-btn {
            color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700; cursor: pointer;
            border: none; background: none; text-decoration: none; padding: 4px 8px;
            border-radius: 8px; transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }
        .phone-title { font-size: 16px; font-weight: 700; color: #fff; flex: 1; }
        .header-badge {
            font-size: 10px; background: rgba(255,215,0,0.2); color: var(--gold);
            padding: 4px 8px; border-radius: 10px; font-weight: 700;
        }
        .phone-body {
            flex: 1; padding: 16px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 14px; position: relative;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes pulseGlow { 
            0%,100% { box-shadow: 0 0 0 0 rgba(0,229,255,0.4); } 
            50% { box-shadow: 0 0 0 12px rgba(0,229,255,0); } 
        }
        @keyframes starTwinkle {
            0%,100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ===== 卡片通用 ===== */
        .card {
            background: #fff; border-radius: 16px; padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            animation: fadeIn 0.5s ease-out both;
        }
        .card-title {
            font-size: 15px; font-weight: 700; color: #2d2d2d;
            margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
        }
        .card-title .icon { font-size: 20px; }

        /* ===== KPL Hero Banner ===== */
        .kpl-hero {
            background: linear-gradient(135deg, #6b1fb8 0%, #4a148c 60%, #1a0533 100%);
            border-radius: 18px; padding: 20px; color: #fff; text-align: center;
            position: relative; overflow: hidden; animation: popIn 0.5s ease-out;
        }
        .kpl-hero::before {
            content: ''; position: absolute; top: -30px; right: -30px;
            width: 120px; height: 120px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
        }
        .kpl-stars {
            position: absolute; inset: 0; pointer-events: none;
        }
        .kpl-stars .s {
            position: absolute; width: 3px; height: 3px; background: #fff;
            border-radius: 50%; animation: starTwinkle 2s ease-in-out infinite;
        }
        .kpl-hero-icon { font-size: 40px; margin-bottom: 8px; position: relative; z-index: 1; }
        .kpl-hero-title { 
            font-size: 20px; font-weight: 900; position: relative; z-index: 1;
            margin-bottom: 4px; letter-spacing: 1px;
        }
        .kpl-hero-sub {
            font-size: 12px; color: rgba(255,255,255,0.75);
            position: relative; z-index: 1;
        }

        /* ===== 预热任务 ===== */
        .preheat-card {
            background: linear-gradient(135deg, #fff7ed, #fff);
            border: 2px solid rgba(255,140,0,0.2);
        }
        .preheat-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 12px;
            background: #fff; border: 1px solid #ede7f6;
            transition: all 0.3s;
        }
        .preheat-item.done {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-color: #a5d6a7;
        }
        .preheat-check {
            width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid #b39ddb; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #b39ddb; font-size: 13px; cursor: pointer;
            transition: all 0.3s;
        }
        .preheat-item.done .preheat-check {
            background: linear-gradient(135deg, #66bb6a, #4caf50);
            border-color: #4caf50; color: #fff;
        }
        .preheat-info { flex: 1; }
        .preheat-name { font-size: 13px; font-weight: 700; color: #2d2d2d; }
        .preheat-reward { font-size: 11px; color: #7c4dff; margin-top: 2px; font-weight: 600; }
        .preheat-lottery-btn {
            padding: 8px 16px; border-radius: 20px; border: none;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a0533; font-weight: 800; font-size: 12px;
            cursor: pointer; flex-shrink: 0; transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(255,140,0,0.3);
        }
        .preheat-lottery-btn:disabled {
            background: #ddd; color: #999; cursor: not-allowed;
            box-shadow: none;
        }
        .preheat-lottery-btn:not(:disabled):hover {
            transform: scale(1.05); box-shadow: 0 4px 16px rgba(255,140,0,0.5);
        }

        /* ===== 地图区域 ===== */
        .map-card {
            padding: 0; overflow: hidden;
            background: linear-gradient(180deg, #6b1fb8 0%, #4a148c 100%);
            position: relative;
            box-shadow: 0 4px 18px rgba(107,31,184,0.25);
        }
        .map-card::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 70% 20%, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 50% 60%, rgba(255,255,255,0.35), transparent),
                radial-gradient(2px 2px at 85% 75%, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 15% 85%, rgba(255,255,255,0.3), transparent);
            opacity: 0.6; z-index: 1;
        }
        .map-card-inner {
            position: relative; z-index: 2; padding: 14px 0 0;
        }
        .map-header {
            text-align: center; padding: 0 16px 10px;
        }
        .map-header-title {
            font-size: 17px; font-weight: 900; color: #fff;
            margin-bottom: 2px;
        }
        .map-header-sub {
            font-size: 11px; color: rgba(255,255,255,0.7);
        }
        .map-area {
            position: relative;
            margin: 0 10px 0;
            width: calc(100% - 20px);
            border-radius: 12px; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.12);
        }
        .map-bg {
            width: 100%;
            display: block;
            background: none;
        }
        .map-bg img {
            width: 100%; height: auto; display: block;
        }

        /* 进度覆盖层（替换积分兑换区域） */
        .map-progress-overlay {
            position: absolute; bottom: 8%; left: 5%; right: 5%;
            background: rgba(26,5,51,0.88); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 22px 14px 14px;
            display: flex; flex-direction: column; gap: 6px;
            z-index: 10; border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .map-progress-overlay::before {
            content: '🏆';
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(255,140,0,0.5);
            border: 2px solid rgba(255,255,255,0.9);
        }
        .map-progress-row {
            display: flex; align-items: flex-end;
            gap: 2px;
        }
        .map-progress-step {
            display: flex; flex-direction: column; align-items: center;
            gap: 5px; min-width: 64px;
        }
        .map-progress-step .mp-icon {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4);
            border: 2px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 900;
            transition: all 0.3s;
        }
        .map-progress-step.reached .mp-icon {
            background: linear-gradient(135deg, #00e5ff, #2196f3);
            color: #fff; border-color: #00e5ff;
            box-shadow: 0 0 16px rgba(0,229,255,0.6);
        }
        .map-progress-step .mp-label {
            font-size: 11px; color: rgba(255,255,255,0.55);
            font-weight: 600; white-space: nowrap;
        }
        .map-progress-step.reached .mp-label {
            color: #00e5ff; font-weight: 700;
        }
        .map-progress-step .mp-reward {
            font-size: 10px; color: #fff; font-weight: 800;
            background: linear-gradient(135deg, #ff8c00, #ff6b00);
            padding: 3px 10px;
            border-radius: 10px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(255,140,0,0.4);
        }
        .map-progress-connector {
            flex: 1; height: 2px;
            background: rgba(255,255,255,0.2);
            margin-bottom: 30px;
            min-width: 12px;
            border-radius: 1px;
            transition: background 0.3s;
        }
        .map-progress-connector.active {
            background: linear-gradient(90deg, #00e5ff, #2196f3);
            box-shadow: 0 0 6px rgba(0,229,255,0.5);
        }

        /* 地图 Pin 点 */
        .pin {
            position: absolute; transform: translate(-50%, -50%);
            width: 28px; height: 28px; border-radius: 50%; z-index: 20;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #fff; font-weight: 900;
            border: 2px solid #fff; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .pin:hover { transform: translate(-50%, -50%) scale(1.2); }
        .pin.game { background: linear-gradient(135deg, #6c5ce7, #5e35b1); }
        .pin.nfc  { background: linear-gradient(135deg, #ff6b6b, #ee5a52); }
        .pin.checked { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #4d3800; }
        .pin-label {
            position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
            white-space: nowrap; background: rgba(0,0,0,0.85); color: #fff;
            padding: 2px 7px; border-radius: 4px; font-size: 9px; font-weight: 600;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .pin:hover .pin-label { opacity: 1; }

        /* 图例 */
        .map-legend {
            display: flex; justify-content: center; gap: 16px;
            padding: 12px 16px; font-size: 10px; color: rgba(255,255,255,0.8);
        }
        .map-legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-dot {
            width: 10px; height: 10px; border-radius: 50%;
        }
        .legend-dot.game { background: linear-gradient(135deg, #6c5ce7, #5e35b1); }
        .legend-dot.nfc  { background: linear-gradient(135deg, #ff6b6b, #ee5a52); }
        .legend-dot.checked { background: linear-gradient(135deg, #ffd700, #ff8c00); }

        /* 按钮 */
        .simulate-btn {
            width: 100%; padding: 14px 0; border-radius: 14px; border: none;
            background: linear-gradient(135deg, #00e5ff, #2196f3);
            color: #fff; font-size: 15px; font-weight: 900; cursor: pointer;
            box-shadow: 0 3px 14px rgba(0,229,255,0.3);
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .simulate-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0,229,255,0.5);
        }
        .reset-btn {
            width: 100%; padding: 12px 0; border-radius: 14px; border: 2px solid #ddd;
            background: #fff; color: #999; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .reset-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

        /* Toast */
        .toast {
            position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(26,5,51,0.92); color: #fff;
            padding: 14px 28px; border-radius: 24px;
            font-size: 14px; font-weight: 700; z-index: 999;
            opacity: 0; transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            pointer-events: none; text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }

        /* 抽奖弹窗 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 998;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #fff; border-radius: 24px; padding: 30px 24px;
            text-align: center; max-width: 320px; position: relative;
            animation: popIn 0.4s ease-out;
        }
        .modal-icon { font-size: 60px; margin-bottom: 12px; }
        .modal-title { font-size: 20px; font-weight: 900; color: var(--kpl-purple); margin-bottom: 6px; }
        .modal-desc { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.6; }
        .modal-btn {
            width: 100%; padding: 14px 0; border: none;
            border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a0533; box-shadow: 0 4px 14px rgba(255,140,0,0.4);
            transition: all 0.2s;
        }
        .modal-btn:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(255,140,0,0.5); }
        .modal-close {
            position: absolute; top: 12px; right: 16px;
            background: none; border: none; font-size: 18px; color: #999;
            cursor: pointer; padding: 4px;
        }
    </style>
</head>
<body>
<div class="phone">
    <!-- 顶栏 -->
    <div class="phone-header">
        <a class="back-btn" href="index.html">← 返回</a>
        <span class="phone-title">KPL奇妙日 · 多点位打卡</span>
        <span class="header-badge">🏆 KPL</span>
    </div>

    <div class="phone-body">
        <!-- Hero Banner -->
        <div class="kpl-hero">
            <div class="kpl-stars">
                <div class="s" style="top:12%;left:10%;animation-delay:0s"></div>
                <div class="s" style="top:25%;right:15%;animation-delay:0.7s"></div>
                <div class="s" style="bottom:35%;left:20%;animation-delay:1.4s"></div>
                <div class="s" style="top:45%;right:10%;animation-delay:0.3s"></div>
                <div class="s" style="bottom:25%;right:25%;animation-delay:1.1s"></div>
            </div>
            <div class="kpl-hero-icon">🏟️</div>
            <div class="kpl-hero-title">KPL奇妙日</div>
            <div class="kpl-hero-sub">多点位打卡 · 解锁线下抽奖机会</div>
        </div>

        <!-- 预热任务 -->
        <div class="card preheat-card" id="preheatCard">
            <div class="card-title"><span class="icon">🔥</span> 预热任务</div>
            <div class="preheat-item" id="preheatItem">
                <div class="preheat-check" id="preheatCheck" onclick="completePreheat()">✓</div>
                <div class="preheat-info">
                    <div class="preheat-name">赛事预热 · 分享给好友</div>
                    <div class="preheat-reward">完成即可抽奖</div>
                </div>
                <button class="preheat-lottery-btn" id="preheatLotteryBtn" disabled onclick="doPreheatLottery()">
                    🎁 抽奖
                </button>
            </div>
        </div>

        <!-- 地图区域 -->
        <div class="card map-card">
            <div class="map-card-inner">
                <div class="map-header">
                    <div class="map-header-title">📍 探索地图 · 解锁点位</div>
                    <div class="map-header-sub">到达线下点位完成打卡，集齐 3 / 6 个解锁抽奖</div>
                </div>
                <div class="map-area" id="mapArea">
                    <div class="map-bg"><img src="img/kpl-qimiao-map.png" alt="KPL奇妙日地图"></div>

                    <!-- Pins: 4 游戏登录点位 + 2 NFC 打卡点位 -->
                    <!-- 游戏登录点位 -->
                    <div class="pin game" style="top:22%;left:30%;" data-id="pin1" onclick="checkIn('pin1')">
                        <span class="pin-label">对局签到点①</span>🎮
                    </div>
                    <div class="pin game" style="top:32%;left:65%;" data-id="pin2" onclick="checkIn('pin2')">
                        <span class="pin-label">对局签到点②</span>🎮
                    </div>
                    <div class="pin game" style="top:52%;left:72%;" data-id="pin3" onclick="checkIn('pin3')">
                        <span class="pin-label">对局签到点③</span>🎮
                    </div>
                    <div class="pin game" style="top:62%;left:28%;" data-id="pin4" onclick="checkIn('pin4')">
                        <span class="pin-label">对局签到点④</span>🎮
                    </div>
                    <!-- NFC 打卡点位 -->
                    <div class="pin nfc" style="top:42%;left:42%;" data-id="pin5" onclick="checkIn('pin5')">
                        <span class="pin-label">NFC碰卡点①</span>📳
                    </div>
                    <div class="pin nfc" style="top:70%;left:55%;" data-id="pin6" onclick="checkIn('pin6')">
                        <span class="pin-label">NFC碰卡点②</span>📳
                    </div>

                    <!-- 进度覆盖层（替换积分兑换） -->
                    <div class="map-progress-overlay" id="mapProgressOverlay">
                        <div class="map-progress-row">
                            <div class="map-progress-step reached" id="mapStep0">
                                <div class="mp-icon">0</div>
                                <div class="mp-label">开始探索</div>
                            </div>
                            <div class="map-progress-connector" id="mapConn1"></div>
                            <div class="map-progress-step" id="mapStep3">
                                <div class="mp-icon">3</div>
                                <div class="mp-label">解锁3点</div>
                                <div class="mp-reward">🎁 线下抽奖×1</div>
                            </div>
                            <div class="map-progress-connector" id="mapConn2"></div>
                            <div class="map-progress-step" id="mapStep6">
                                <div class="mp-icon">6</div>
                                <div class="mp-label">解锁6点</div>
                                <div class="mp-reward">🎁 线下抽奖×1</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="map-legend">
                    <div class="map-legend-item"><span class="legend-dot game"></span> 游戏登录</div>
                    <div class="map-legend-item"><span class="legend-dot nfc"></span> NFC碰卡</div>
                    <div class="map-legend-item"><span class="legend-dot checked"></span> 已打卡</div>
                </div>
            </div>
        </div>

        <!-- 模拟打卡按钮 -->
        <button class="simulate-btn" onclick="simulateCheckIn()">
            📳 模拟随机打卡
        </button>
        <button class="reset-btn" onclick="resetAll()">
            🔄 重置全部状态
        </button>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 抽奖弹窗 -->
<div class="modal-overlay" id="lotteryModal">
    <div class="modal-card">
        <button class="modal-close" onclick="closeModal('lotteryModal')">✕</button>
        <div class="modal-icon" id="lotteryIcon">🎉</div>
        <div class="modal-title" id="lotteryTitle">恭喜获得抽奖机会！</div>
        <div class="modal-desc" id="lotteryDesc"></div>
        <button class="modal-btn" onclick="closeModal('lotteryModal')">🎁 知道了</button>
    </div>
</div>

<script>
// ==================== 数据状态 ====================
let preheatDone = false;
let checkedInPins = new Set(); // 已打卡的 pin id 列表
const TOTAL = 6;

// 里程碑
const MILESTONE_3 = 3;
const MILESTONE_6 = 6;

// 已触发的里程碑（防止重复弹窗）
let milestoneTriggered = { 3: false, 6: false };

// ==================== 预热任务 ====================
function completePreheat() {
    if (preheatDone) return;
    preheatDone = true;
    const el = document.getElementById('preheatItem');
    const check = document.getElementById('preheatCheck');
    const btn = document.getElementById('preheatLotteryBtn');
    el.classList.add('done');
    check.textContent = '✓';
    check.style.pointerEvents = 'none';
    btn.disabled = false;
    showToast('🔥 预热任务完成！可以抽奖啦');
}

function doPreheatLottery() {
    if (!preheatDone) return;
    document.getElementById('lotteryIcon').textContent = '🎁';
    document.getElementById('lotteryTitle').textContent = '预热抽奖机会';
    document.getElementById('lotteryDesc').textContent = '恭喜获得预热抽奖机会！在活动页可参与抽奖赢取实物奖励。';
    openModal('lotteryModal');
    // 抽奖后禁用
    const btn = document.getElementById('preheatLotteryBtn');
    btn.disabled = true;
    btn.textContent = '已抽取';
    btn.style.background = '#ddd';
    btn.style.color = '#999';
}

// ==================== 打卡系统 ====================
function checkIn(pinId) {
    if (checkedInPins.has(pinId)) return;
    checkedInPins.add(pinId);
    updateAllUI();
    const pin = document.querySelector(`[data-id="${pinId}"]`);
    const label = pin.querySelector('.pin-label').textContent;
    showToast(`✅ 已打卡：${label}`);

    // 检查里程碑
    checkMilestones();
}

function simulateCheckIn() {
    // 找到所有未打卡的 pin
    const allPins = ['pin1','pin2','pin3','pin4','pin5','pin6'];
    const remaining = allPins.filter(p => !checkedInPins.has(p));
    if (remaining.length === 0) {
        showToast('🎉 全部点位已打卡！');
        return;
    }
    const randomPin = remaining[Math.floor(Math.random() * remaining.length)];
    checkIn(randomPin);
}

// ==================== 里程碑检测 ====================
function checkMilestones() {
    const count = checkedInPins.size;

    if (count >= MILESTONE_3 && !milestoneTriggered[3]) {
        milestoneTriggered[3] = true;
        setTimeout(() => {
            document.getElementById('lotteryIcon').textContent = '🎰';
            document.getElementById('lotteryTitle').textContent = '🎉 解锁 3 个点位！';
            document.getElementById('lotteryDesc').textContent = '获得 1 次线下抽奖机会！可在现场参与抽奖赢取丰厚奖品。';
            openModal('lotteryModal');
        }, 400);
    }

    if (count >= MILESTONE_6 && !milestoneTriggered[6]) {
        milestoneTriggered[6] = true;
        setTimeout(() => {
            document.getElementById('lotteryIcon').textContent = '🏆';
            document.getElementById('lotteryTitle').textContent = '🌟 解锁全部 6 个点位！';
            document.getElementById('lotteryDesc').textContent = '再获得 1 次线下抽奖机会！双倍中奖概率等你来！';
            openModal('lotteryModal');
        }, 400);
    }
}

// ==================== UI 更新 ====================
function updateAllUI() {
    const count = checkedInPins.size;

    // 地图上的进度覆盖层
    if (count >= 3) {
        document.getElementById('mapStep3').classList.add('reached');
        document.getElementById('mapConn1').classList.add('active');
    }
    if (count >= 6) {
        document.getElementById('mapStep6').classList.add('reached');
        document.getElementById('mapConn2').classList.add('active');
    }

    // Pin 状态
    checkedInPins.forEach(pid => {
        const pin = document.querySelector(`[data-id="${pid}"]`);
        if (pin) pin.classList.add('checked');
    });
}

// ==================== 重置 ====================
function resetAll() {
    preheatDone = false;
    checkedInPins.clear();
    milestoneTriggered = { 3: false, 6: false };

    // 预热恢复
    const el = document.getElementById('preheatItem');
    const check = document.getElementById('preheatCheck');
    const btn = document.getElementById('preheatLotteryBtn');
    el.classList.remove('done');
    check.textContent = '✓';
    check.style.pointerEvents = 'auto';
    btn.disabled = true;
    btn.textContent = '🎁 抽奖';
    btn.style.background = 'linear-gradient(135deg, #ffd700, #ff8c00)';
    btn.style.color = '#1a0533';

    // 进度恢复
    document.getElementById('mapStep3').classList.remove('reached');
    document.getElementById('mapStep6').classList.remove('reached');
    document.getElementById('mapConn1').classList.remove('active');
    document.getElementById('mapConn2').classList.remove('active');

    // Pin 恢复
    document.querySelectorAll('.pin').forEach(p => p.classList.remove('checked'));

    showToast('🔄 已重置全部状态');
}

// ==================== 工具函数 ====================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.classList.remove('show'), 1800);
}

function openModal(id) {
    document.getElementById(id).classList.add('show');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('show');
}

// ==================== 初始化 ====================
updateAllUI();
</script>
</body>
</html>
